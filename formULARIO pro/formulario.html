<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h2>Registro de Usuario</h2>
        <p class="text-muted mb-3">Complete los campos obligatorios <span class="text-danger">*</span> para continuar.</p>
        <hr>
        <form action="backend" method="post" onsubmit="return validar()">


            <!-- Fila 1: usuario, clave, confirmación -->
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="username" class="form-label">Nombre de usuario <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="username">
                    <div id="username-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="password" class="form-label">Contraseña <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password">
                    <div id="password-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="re-password" class="form-label">Confirmar contraseña <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="re-password">
                    <div id="re-password-msg" class="form-text text-danger"></div>
                </div>
            </div>

            <!-- Fila 2: dirección, comuna -->
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="direccion" class="form-label">Dirección <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="direccion" placeholder="Ej: Calle Los Robles 1234">
                    <div id="direccion-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="comuna" class="form-label">Comuna <span class="text-danger">*</span></label>
                    <select class="form-select" id="comuna">
                        <option value="">-- Seleccione --</option>
                        <option>Valdivia</option>
                        <option>Mariquina</option>
                        <option>Lanco</option>
                        <option>Los Lagos</option>
                        <option>Corral</option>
                        <option>Futrono</option>
                        <option>La Unión</option>
                        <option>Panguipulli</option>
                        <option>Río Bueno</option>
                        <option>Temuco</option>
                        <option>Santiago</option>
                        <option>Providencia</option>
                        <option>Las Condes</option>
                        <option>Ñuñoa</option>
                        <option>Puerto Montt</option>
                        <option>Concepción</option>
                    </select>
                    <div id="comuna-msg" class="form-text text-danger"></div>
                </div>
            </div>

            <!-- Fila 3: teléfono, url -->
            <div class="row">
                <div class="col-md-5 mb-3">
                    <label for="telefono" class="form-label">Número de teléfono <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="telefono" placeholder="+56 9 1234 5678">
                    <div id="telefono-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-7 mb-3">
                    <label for="url" class="form-label">Página web personal</label>
                    <input type="text" class="form-control" id="url" placeholder="https://mi-sitio.cl">
                    <div id="url-msg" class="form-text text-danger"></div>
                </div>
            </div>

            <!-- Fila 4: aficiones -->
            <div class="row">
                <div class="col-md-5 mb-3">
                    <label for="hobby" class="form-label">Aficiones <span class="text-muted">(mínimo 2)</span></label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="hobby" placeholder="Escribe una afición">
                        <button onclick="agregar()" class="btn btn-secondary" type="button">Agregar</button>
                    </div>
                    <div id="hobby-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-7 mb-3">
                    <label class="form-label">Aficiones agregadas</label>
                    <ul id="hobby-list" class="list-group"></ul>
                </div>
            </div>

            <!-- Botones -->
            <div class="mt-2">
                <button type="submit" class="btn btn-primary me-2">Enviar</button>
                <button type="reset" class="btn btn-outline-secondary" onclick="limpiar()">Limpiar</button>
            </div>

        </form>

        <!-- Resumen del usuario (objeto JS) -->
        <div id="resumen-usuario" class="resumen-usuario mt-4" style="display:none;"></div>
    </main>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
